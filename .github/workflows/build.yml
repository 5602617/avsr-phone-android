name: Build and prepare release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.6'
          cache: false
      - name: Build and verify native tunnel programs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-tunnels.sh
          python3 scripts/native-manifest.py --verify
      - name: Verify and build
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :device-fixture:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validation-and-debug
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AVS_STORE_PASSWORD: ${{ secrets.AVS_STORE_PASSWORD }}
      AVS_KEY_PASSWORD: ${{ secrets.AVS_KEY_PASSWORD }}
      AVS_KEY_ALIAS: ${{ secrets.AVS_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.6'
          cache: false
      - name: Build and verify native tunnel programs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-tunnels.sh
          python3 scripts/native-manifest.py --verify
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.AVS_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Missing signing secret: AVS_KEYSTORE_BASE64')
          path = Path(os.environ['RUNNER_TEMP']) / 'release.p12'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build release
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Sign, validate version, and checksum
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match the application version')
          if not Path(f'docs/RELEASE_NOTES_{version}.md').is_file():
              raise SystemExit('Release notes are missing for ' + version)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('RELEASE_VERSION=' + version + '\n')
          PY
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$AVS_KEY_ALIAS" --ks-pass env:AVS_STORE_PASSWORD --key-pass env:AVS_KEY_PASSWORD --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --debuggable-apk-permitted false --out "dist/shealive-${GITHUB_REF_NAME#v}.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "dist/shealive-${GITHUB_REF_NAME#v}.apk" | tee dist/SIGNING-CERTIFICATE.txt
          grep -Fq 'deca00a4eae839656b9371b7cd48868f727c532f1c31425e4e692a3ec1c56eda' dist/SIGNING-CERTIFICATE.txt
          cd dist
          sha256sum "shealive-${GITHUB_REF_NAME#v}.apk" > SHA256SUMS
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/shealive-$RELEASE_VERSION.apk" dist/SHA256SUMS dist/SIGNING-CERTIFICATE.txt --verify-tag --draft --title "shealive $RELEASE_VERSION" --notes-file "docs/RELEASE_NOTES_$RELEASE_VERSION.md"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/aligned.apk"
